name: Publish Android app release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Fetch packages and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Verify release tag matches app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test -n "$app_version"
          test "$version" = "$app_version"
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/battery-monitor-app-${version}.apk"
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes
